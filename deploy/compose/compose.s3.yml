# Attachments in S3 (plan M9 decision 18, docs/SICHERUNG.md "Anhänge in S3"): SeaweedFS
# (Apache-2.0) as the S3-compatible store, on top of compose.yml:
#
#   docker compose -f compose.yml -f compose.s3.yml up -d --build --wait
#
# The app (role all) and the service backup use HERD_STORAGE=s3 against `s3`; the
# bucket (HERD_S3_BUCKET, default herd) is created once by `s3-bucket`. The keys come
# from .env: HERD_S3_ACCESS_KEY_ID and HERD_S3_SECRET_ACCESS_KEY (`openssl rand -hex
# 24`); SeaweedFS takes them as its one admin identity and refuses anonymous requests.
# Its ports stay inside. Moving the files of an installation that used the volume:
# `docker compose exec app python -m app.ops storage copy --to s3` (again after the
# switch: it copies only what is missing). For compose.nodes.yml or an external store
# (AWS S3, Ceph, Garage, ...) set HERD_STORAGE and HERD_S3_* in .env instead.
services:
  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command:
      - server
      - -dir=/data
      - -ip=s3
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ${HERD_S3_ACCESS_KEY_ID:?set HERD_S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${HERD_S3_SECRET_ACCESS_KEY:?set HERD_S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The bucket is a directory under /buckets of SeaweedFS's filer: created once (201),
  # already there on a restart (409); anything else fails the start.
  s3-bucket:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X POST
        "http://s3:8888/buckets/$${HERD_S3_BUCKET}/");
        echo "bucket $${HERD_S3_BUCKET}: $$code"; [ "$$code" = 201 ] || [ "$$code" = 409 ]
    environment:
      HERD_S3_BUCKET: ${HERD_S3_BUCKET:-herd}
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  app:
    environment: &on-s3
      HERD_STORAGE: s3
      HERD_S3_ENDPOINT: http://s3:8333
      HERD_S3_BUCKET: ${HERD_S3_BUCKET:-herd}
    depends_on: &after-bucket
      s3-bucket:
        condition: service_completed_successfully

  backup:
    environment: *on-s3
    depends_on: *after-bucket

volumes:
  s3-data:
