# Reference deployment: PostgreSQL and the app in one container (HERD_ROLE=all:
# migrate, then serve, with the worker (outbox: notifications, page timelines, live
# updates) in the same process and the live-editing process as a child on 127.0.0.1;
# that child keeps its live documents under HERD_COLLAB_MEMORY_BUDGET_MB, 400 by
# default, and needs up to about 800 MB with it, docs/WIKI.md. If the child dies, the
# app exits and `restart: unless-stopped` starts it again).
# compose.nodes.yml runs the roles in separate containers instead (two API nodes).
# Secrets come from .env next to this file (see .env.example), the AI keys from the
# optional ai.env (see ai.env.example; agent runs work in the same process). Only the public port
# 8080 is published; 9090 (probes, metrics, the collab process's internal API) and
# the collab port stay inside. Attachments live on the volume app-data (/data), or
# with HERD_STORAGE=s3 in an S3-compatible store (compose.s3.yml runs SeaweedFS).
# The service backup makes the backups (docs/SICHERUNG.md): on HERD_BACKUP_SCHEDULE
# into the volume backups (/backups), with retention and, with the optional
# backup.env (see backup.env.example), a restic copy offsite.
name: to-herd-cats-ai

# Where attachments live (docs/SICHERUNG.md, "Anhänge in S3"): `local` (the volume
# app-data) or `s3`. For s3 set the endpoint (scheme://host[:port]), the bucket and its
# keys in .env; keys go under HERD_S3_PREFIX inside the bucket. Moving existing files:
# `docker compose exec app python -m app.ops storage copy --to s3`.
x-storage: &storage
  HERD_STORAGE: ${HERD_STORAGE:-local}
  HERD_S3_ENDPOINT: ${HERD_S3_ENDPOINT:-}
  HERD_S3_REGION: ${HERD_S3_REGION:-us-east-1}
  HERD_S3_BUCKET: ${HERD_S3_BUCKET:-}
  HERD_S3_ACCESS_KEY_ID: ${HERD_S3_ACCESS_KEY_ID:-}
  HERD_S3_SECRET_ACCESS_KEY: ${HERD_S3_SECRET_ACCESS_KEY:-}
  HERD_S3_PREFIX: ${HERD_S3_PREFIX:-}

services:
  db:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: herd
      POSTGRES_DB: herd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herd -d herd"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: to-herd-cats-ai:${HERD_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *storage
      HERD_ROLE: all
      # The password is kept out of the URL; the app merges it in (escaped).
      HERD_DATABASE_URL: postgresql+asyncpg://herd@db:5432/herd
      HERD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      HERD_BOOTSTRAP_ADMIN_EMAIL: ${HERD_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      HERD_BOOTSTRAP_ADMIN_PASSWORD: ${HERD_BOOTSTRAP_ADMIN_PASSWORD:?set HERD_BOOTSTRAP_ADMIN_PASSWORD in .env}
      # Shared by the API and the collab process (live editing); at least 32 characters.
      HERD_INTERNAL_TOKEN: ${HERD_INTERNAL_TOKEN:?set HERD_INTERNAL_TOKEN in .env}
      # The address browsers use, e.g. https://wiki.example; WebSocket Origins must
      # match it. Empty: they must match the host the request came to.
      HERD_PUBLIC_URL: ${HERD_PUBLIC_URL:-}
      HERD_COOKIE_SECURE: ${HERD_COOKIE_SECURE:-false}
      HERD_FORWARDED_ALLOW_IPS: ${HERD_FORWARDED_ALLOW_IPS:-127.0.0.1}
      # A login session ends after this many hours without a request (0: no idle
      # limit; it still ends after 7 days). docs/ANMELDUNG.md.
      HERD_SESSION_IDLE_HOURS: ${HERD_SESSION_IDLE_HOURS:-24}
      HERD_LOG_LEVEL: ${HERD_LOG_LEVEL:-INFO}
      # AI and agents (docs/AGENTEN.md): test call timeout, personal agents and
      # automations per person, hours a run waits for a release or an answer, runs at
      # once, a run's lease.
      HERD_AI_CHECK_TIMEOUT_SECONDS: ${HERD_AI_CHECK_TIMEOUT_SECONDS:-20}
      HERD_AI_PERSONAL_AGENTS_MAX: ${HERD_AI_PERSONAL_AGENTS_MAX:-5}
      HERD_AI_AUTOMATIONS_MAX: ${HERD_AI_AUTOMATIONS_MAX:-20}
      HERD_AI_APPROVAL_HOURS: ${HERD_AI_APPROVAL_HOURS:-72}
      HERD_RUN_CONCURRENCY: ${HERD_RUN_CONCURRENCY:-4}
      HERD_RUN_LEASE_SECONDS: ${HERD_RUN_LEASE_SECONDS:-30}
      # MCP (docs/MCP.md): calls per access token and minute; private hosts (names or
      # CIDR, comma separated) external MCP servers may run on (empty: none); the
      # directory, inside the container, of the operator's own catalogue entries
      # (mount it read-only, e.g. in compose.override.yml; empty: the shipped ones);
      # calls one agent run may send to external MCP servers.
      HERD_MCP_RATE_PER_MINUTE: ${HERD_MCP_RATE_PER_MINUTE:-120}
      HERD_MCP_ALLOWED_HOSTS: ${HERD_MCP_ALLOWED_HOSTS:-}
      HERD_MCP_CATALOG_DIR: ${HERD_MCP_CATALOG_DIR:-}
      HERD_MCP_MAX_CALLS_PER_RUN: ${HERD_MCP_MAX_CALLS_PER_RUN:-20}
      # Backups (docs/SICHERUNG.md): the worker exports the age of the last good backup
      # at which HerdBackupTooOld fires, in hours. The administration's page (owners)
      # lists, makes, checks and restores archives on the volume backups; an uploaded
      # archive may be this large (bytes, default 2 GiB; a proxy in front needs as much).
      HERD_BACKUP_ALERT_AFTER_HOURS: ${HERD_BACKUP_ALERT_AFTER_HOURS:-26}
      HERD_BACKUP_UPLOAD_MAX_BYTES: ${HERD_BACKUP_UPLOAD_MAX_BYTES:-2147483648}
      # Sign-in through OIDC (docs/ANMELDUNG.md): private hosts (names or CIDR, comma
      # separated) an identity provider may run on (empty: public ones only); starts
      # and callbacks per client address and minute. HERD_PUBLIC_URL must be set.
      HERD_OIDC_ALLOWED_HOSTS: ${HERD_OIDC_ALLOWED_HOSTS:-}
      HERD_OIDC_RATE_PER_MINUTE: ${HERD_OIDC_RATE_PER_MINUTE:-30}
    # HERD_SECRET_KEY, HERD_SECRET_KEY_PREVIOUS, HERD_AI_EGRESS_PROXY and the provider
    # keys (env:HERD_AI_<NAME>), OIDC client secrets (env:HERD_OIDC_<NAME>); never
    # listed under environment, where an empty default would hide them.
    env_file:
      - path: ai.env
        required: false
    ports:
      - "${HERD_BIND_ADDRESS:-127.0.0.1}:${HERD_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    # backups: the administration's archives ("Jetzt sichern" runs in the worker,
    # downloads, uploads, checks and a restore in the API).
    volumes:
      - app-data:/data
      - backups:/backups
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

  # Backups (plan M9, docs/SICHERUNG.md): `python -m app.ops backup schedule` makes an
  # archive (database dump and attachments) on HERD_BACKUP_SCHEDULE (cron, UTC), checks
  # it, keeps the newest of the last days, weeks and months on the volume backups, and
  # with HERD_BACKUP_OFFSITE_REPOSITORY (in backup.env) copies it with restic. It reads
  # the attachments (the volume or the S3 store), never writes them. HERD_SECRET_KEY (ai.env) only names its key id
  # in the archive, for the restore's check; restic gets none of the app's environment.
  # By hand: docker compose exec backup python -m app.ops backup run (or list).
  backup:
    image: to-herd-cats-ai:${HERD_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["/usr/bin/tini", "--", "python", "-m", "app.ops"]
    command: ["backup", "schedule"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *storage
      HERD_DATABASE_URL: postgresql+asyncpg://herd@db:5432/herd
      HERD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      HERD_BACKUP_SCHEDULE: ${HERD_BACKUP_SCHEDULE:-30 2 * * *}
      HERD_BACKUP_KEEP_DAILY: ${HERD_BACKUP_KEEP_DAILY:-7}
      HERD_BACKUP_KEEP_WEEKLY: ${HERD_BACKUP_KEEP_WEEKLY:-4}
      HERD_BACKUP_KEEP_MONTHLY: ${HERD_BACKUP_KEEP_MONTHLY:-6}
      HERD_LOG_LEVEL: ${HERD_LOG_LEVEL:-INFO}
    # ai.env for HERD_SECRET_KEY; backup.env for HERD_BACKUP_OFFSITE_REPOSITORY,
    # HERD_BACKUP_OFFSITE_PASSWORD and the storage's credentials (AWS_*, B2_*, ...).
    env_file:
      - path: ai.env
        required: false
      - path: backup.env
        required: false
    # It serves no port, so the image's health check (port 9090) does not apply. A
    # disabled check would fail `docker compose up --wait` at once ("no healthcheck
    # configured"); this one asks whether the backup directory is there and writable
    # (the volume mounted for uid 10001). The scheduler itself is the container's process.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; d = os.environ.get('HERD_BACKUP_DIR', '/backups'); sys.exit(0 if os.path.isdir(d) and os.access(d, os.W_OK | os.X_OK) else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
    read_only: true
    # /tmp holds restic's cache only (the dump goes to /backups): capped, it is RAM.
    tmpfs:
      - /tmp:size=1g
    volumes:
      - app-data:/data:ro
      - backups:/backups
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  db-data:
  app-data:
  backups:
