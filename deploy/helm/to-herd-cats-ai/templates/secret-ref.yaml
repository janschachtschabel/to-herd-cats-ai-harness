{{- /*
The chart takes secrets only by reference (secrets.existingSecret,
database.existingSecret). The single exception is the bundled PostgreSQL's
password when no database.existingSecret is given: generated once, then read back
from the cluster on every upgrade, and kept on uninstall so that a reinstall still
matches the data volume. `lookup` needs a live cluster: rendered with `helm template`
(Argo CD, Flux, --dry-run) it is empty and a new password would appear on every
render, so GitOps setups set database.existingSecret.
*/ -}}
{{- if and .Values.postgresql.enabled (not .Values.database.existingSecret) }}
{{- $name := printf "%s-postgresql" (include "herd.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
