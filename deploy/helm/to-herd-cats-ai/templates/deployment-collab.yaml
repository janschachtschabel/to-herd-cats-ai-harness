{{- if .Values.collab.enabled }}
# The collab process (live editing, HERD_ROLE=collab: node collab/server.mjs).
# A page's live document lives in one process's memory while people edit it. With
# collab.replicas above 1 each pod announces itself at its pod IP and the API binds
# every page to one pod, relaying all of the page's browsers there (spec 12.4, plan M9
# decision 17); the pods roll one at a time. One replica (the default) is replaced with
# Recreate. Its state is saved to PostgreSQL through the API (at the latest 10 s after
# a change, and on SIGTERM, when it drains: no new pages, everything saved, its pages
# let go); the browsers reconnect by themselves, to another pod if there is one.
# Memory: the process refuses to load more documents than HERD_COLLAB_MEMORY_BUDGET_MB
# (default 400) by its own estimate; the limit must hold that plus ~130 MB for the
# process and ~250 MB per check worker, with a fifth to spare (docs/WIKI.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "herd.fullname" . }}-collab
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    app.kubernetes.io/component: collab
spec:
  replicas: {{ .Values.collab.replicas }}
  strategy:
    {{- if gt (int .Values.collab.replicas) 1 }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "herd.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collab
  template:
    metadata:
      labels:
        {{- include "herd.labels" . | nindent 8 }}
        app.kubernetes.io/component: collab
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "herd.podSecurityContext" . | nindent 8 }}
      # SIGTERM: the process drains (no new pages, every open document saved, up to
      # 10 s, its pages let go), then exits.
      terminationGracePeriodSeconds: 30
      containers:
        - name: collab
          image: {{ include "herd.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- $own := include "herd.collabOwnEnv" . }}
            {{- include "herd.withExtraEnv" (dict "own" $own "extra" .Values.collab.env "where" "collab.env") | nindent 12 }}
          ports:
            - name: collab
              containerPort: 1234
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: collab
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: collab
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: collab
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.collab.resources | nindent 12 }}
          securityContext:
            {{- include "herd.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Only the API pods dial it (the relay of /collab/); never behind the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "herd.fullname" . }}-collab
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    app.kubernetes.io/component: collab
spec:
  type: ClusterIP
  selector:
    {{- include "herd.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collab
  ports:
    - name: collab
      port: 1234
      targetPort: collab
      protocol: TCP
---
# Its /metrics (the memory budget of the loaded documents: estimate, budget, refusals;
# docs/WIKI.md), scraped like the API's: the ServiceMonitor selects this Service by its
# endpoint label and its port name.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "herd.fullname" . }}-collab-metrics
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    app.kubernetes.io/component: collab
    app.kubernetes.io/endpoint: internal
spec:
  clusterIP: None
  selector:
    {{- include "herd.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collab
  ports:
    - name: internal
      port: 1234
      targetPort: collab
      protocol: TCP
{{- end }}
