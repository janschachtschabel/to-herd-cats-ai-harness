{{- if and .Values.backup.enabled (not .Values.backup.persistence.existingClaim) }}
# The backup archives on /backups (the CronJob's alone). Kept on uninstall: they are
# what a restore needs after one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "herd.fullname" . }}-backups
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.backup.persistence.accessModes | nindent 4 }}
  {{- with .Values.backup.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
{{- end }}
