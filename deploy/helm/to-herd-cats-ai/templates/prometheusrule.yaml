{{- if .Values.metrics.prometheusRule.enabled }}
# The rules are files/prometheus-rules.yaml unchanged (tested by tests/rules-test.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "herd.fullname" . }}
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/prometheus-rules.yaml" | nindent 2 }}
{{- end }}
