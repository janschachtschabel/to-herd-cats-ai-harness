{{- if .Values.postgresql.enabled }}
{{- /* Every API or worker pod holds up to 16 connections (pool 5 + overflow 10 +
LISTEN; measured in the load test, docs/STECKBRIEF.md); 10 more for the backup job,
the migration and an operator's psql. */ -}}
{{- $pods := add (include "herd.maxReplicas" (dict "root" $ "component" "api")) (include "herd.maxReplicas" (dict "root" $ "component" "worker")) -}}
{{- $needed := add (mul 16 $pods) 10 -}}
{{- if gt (int $needed) (int .Values.postgresql.maxConnections) -}}
{{- fail (printf "postgresql.maxConnections (%d) is below the %d connections the API and worker pods may hold at their most (16 per pod + 10): raise it or lower the replicas or autoscaling.maxReplicas" (int .Values.postgresql.maxConnections) (int $needed)) -}}
{{- end }}
# A minimal single-pod PostgreSQL with pgvector, for test and staging only: no
# replication, no backups. Production uses an external database (database.url).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "herd.fullname" . }}-postgresql
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  selector:
    {{- include "herd.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "herd.fullname" . }}-postgresql
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  replicas: 1
  serviceName: {{ include "herd.fullname" . }}-postgresql
  selector:
    matchLabels:
      {{- include "herd.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "herd.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      automountServiceAccountToken: false
      # Pod Security "restricted": the image's postgres user (999), read-only root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["-c", "max_connections={{ int .Values.postgresql.maxConnections }}"]
          env:
            - name: POSTGRES_USER
              value: herd
            - name: POSTGRES_DB
              value: herd
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/secrets/herd/database/password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "herd", "-d", "herd", "-h", "127.0.0.1"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "herd", "-d", "herd", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: password
              mountPath: /var/run/secrets/herd/database
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: password
          secret:
            secretName: {{ include "herd.databaseSecret" . }}
            defaultMode: 0440
            items:
              - key: password
                path: password
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "herd.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: postgresql
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
{{- end }}
