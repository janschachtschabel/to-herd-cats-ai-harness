{{- /*
Migrations (HERD_ROLE=migrate). With an external database this is a pre-install,
pre-upgrade hook: the schema is current before the new API pods start. The bundled
PostgreSQL does not exist yet when pre-install hooks run, so with it the job is an
ordinary resource, one per revision; until it has run, the API pods restart (their
bootstrap needs the schema) and stay not ready, and the job retries until the
database answers. Fine for test and staging, which is all the bundled one is for.
*/ -}}
{{- $hook := not .Values.postgresql.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "herd.fullname" . }}-migrate{{ if not $hook }}-{{ .Release.Revision }}{{ end }}
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  {{- if $hook }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  {{- if not $hook }}
  ttlSecondsAfterFinished: 86400
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "herd.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "herd.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "herd.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- $own := include "herd.env" (dict "root" . "role" "migrate") }}
            {{- include "herd.withExtraEnv" (dict "own" $own "extra" .Values.api.env "where" "api.env") | nindent 12 }}
          # No secrets.existingSecret: migrations need only the database.
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "herd.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "herd.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "herd.volumes" . | nindent 8 }}
