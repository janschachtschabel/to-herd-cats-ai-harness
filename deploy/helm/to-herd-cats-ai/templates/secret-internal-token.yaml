{{- /*
The token the API's /internal/* and the collab process share (HERD_INTERNAL_TOKEN).
Never a value of the chart: either collab.internalToken.existingSecret, or generated
here once and read back from the cluster on every upgrade (like the bundled
PostgreSQL's password; with `helm template` set existingSecret).
*/ -}}
{{- if and .Values.collab.enabled (not .Values.collab.internalToken.existingSecret) }}
{{- $name := include "herd.internalTokenSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    app.kubernetes.io/component: collab
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "token") }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
{{- end }}
