{{- if .Values.backup.enabled }}
{{- /* With s3.enabled the backup reads the attachments from the store: no files claim. */ -}}
{{- $filesClaim := not .Values.s3.enabled }}
{{- if and $filesClaim (not .Values.persistence.enabled) }}
{{- fail "backup.enabled needs persistence.enabled (or s3.enabled): the backup reads the attachments from the files claim (set backup.enabled=false for trials without one)" }}
{{- end }}
{{- if and $filesClaim (not .Values.persistence.existingClaim) (has "ReadWriteOncePod" .Values.persistence.accessModes) (not (has "ReadWriteMany" .Values.persistence.accessModes)) }}
{{- fail "backup.enabled cannot use a ReadWriteOncePod files claim: the backup pod mounts it beside the API pod (use ReadWriteOnce or ReadWriteMany, or backup.enabled=false)" }}
{{- end }}
{{- /* On a ReadWriteOnce claim the chart created, the backup pod must run where an API
pod has the claim mounted. */ -}}
{{- $besideApi := and $filesClaim (not .Values.persistence.existingClaim) (not (has "ReadWriteMany" .Values.persistence.accessModes)) }}
# Backups (plan M9, docs/SICHERUNG.md): `python -m app.ops backup run --scheduled` (the
# trigger recorded is schedule; by hand, without the flag, cli) writes an archive
# of the database (pg_dump from one snapshot) and the attachments to /backups, reads it
# back and checks it, applies the retention and, with backup.offsite.existingSecret,
# copies it with restic. One at a time (Forbid); a failed run is not retried, its
# backup_run row says why and HerdBackupFailing fires (the worker exports the gauges).
# The files claim is mounted read-only (with s3.enabled the files come from the store
# and /data is an emptyDir); HERD_SECRET_KEY (ai.existingSecret) only names
# its key id in the archive. restic's environment is built by the job: the offsite
# Secret's storage credentials reach restic alone.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "herd.fullname" . }}-backup
  labels:
    {{- include "herd.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "herd.labels" . | nindent 8 }}
        app.kubernetes.io/component: backup
    spec:
      backoffLimit: 0
      # A backup longer than 6 hours is stopped: the worker's due loop (or the next
      # backup) marks its backup_run row interrupted once its backup lock is gone, and
      # HerdBackupTooOld fires once the last good one is too old.
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            {{- include "herd.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "herd.podSecurityContext" . | nindent 12 }}
          {{- if $besideApi }}
          # The files claim is ReadWriteOnce: mountable only on the node of the API pod.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      {{- include "herd.selectorLabels" . | nindent 22 }}
                      app.kubernetes.io/component: api
                  topologyKey: kubernetes.io/hostname
          {{- end }}
          containers:
            - name: backup
              image: {{ include "herd.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/usr/bin/tini", "--", "python", "-m", "app.ops", "backup", "run", "--scheduled"]
              env:
                - name: HERD_DATABASE_URL
                  value: {{ include "herd.databaseUrl" . | quote }}
                {{- if include "herd.databaseSecret" . }}
                - name: HERD_DATABASE_PASSWORD_FILE
                  value: /var/run/secrets/herd/database/password
                {{- end }}
                {{- with include "herd.databaseTlsEnv" . }}
                {{- . | nindent 16 }}
                {{- end }}
                {{- with include "herd.migrateDatabaseEnv" . }}
                {{- . | nindent 16 }}
                {{- end }}
                - name: HERD_BACKUP_DIR
                  value: /backups
                - name: HERD_BACKUP_KEEP_DAILY
                  value: {{ .Values.backup.keepDaily | quote }}
                - name: HERD_BACKUP_KEEP_WEEKLY
                  value: {{ .Values.backup.keepWeekly | quote }}
                - name: HERD_BACKUP_KEEP_MONTHLY
                  value: {{ .Values.backup.keepMonthly | quote }}
                {{- with .Values.ai.existingSecret }}
                - name: HERD_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ . }}
                      key: HERD_SECRET_KEY
                      optional: true
                {{- end }}
                {{- with include "herd.s3Env" . }}{{ . | nindent 16 }}{{- end }}
              {{- with .Values.backup.offsite.existingSecret }}
              # HERD_BACKUP_OFFSITE_REPOSITORY, HERD_BACKUP_OFFSITE_PASSWORD, AWS_*, B2_*, ...
              envFrom:
                - secretRef:
                    name: {{ . }}
              {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              securityContext:
                {{- include "herd.containerSecurityContext" . | nindent 16 }}
              volumeMounts:
                {{- include "herd.volumeMounts" . | nindent 16 }}
                {{- with include "herd.migrateVolumeMount" . }}{{ . | nindent 16 }}{{- end }}
                - name: data
                  mountPath: /data
                  readOnly: true
                {{- with include "herd.s3VolumeMount" . }}{{ . | nindent 16 }}{{- end }}
                - name: backups
                  mountPath: /backups
          volumes:
            {{- include "herd.volumesSized" (dict "root" . "tmpSizeLimit" .Values.backup.tmpSizeLimit) | nindent 12 }}
            {{- with include "herd.migrateVolume" . }}{{ . | nindent 12 }}{{- end }}
            - name: data
              {{- if $filesClaim }}
              persistentVolumeClaim:
                claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "herd.fullname" .)) }}
                readOnly: true
              {{- else }}
              emptyDir: {}
              {{- end }}
            {{- with include "herd.s3Volume" . }}{{ . | nindent 12 }}{{- end }}
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.persistence.existingClaim | default (printf "%s-backups" (include "herd.fullname" .)) }}
{{- end }}
