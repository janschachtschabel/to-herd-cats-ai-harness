# Used by the alembic CLI (`uv run alembic upgrade head`). The application builds its
# config in code (app.core.migrations.alembic_config). No [loggers] sections on purpose:
# env.py never calls fileConfig, which would disable every logger already configured.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os
