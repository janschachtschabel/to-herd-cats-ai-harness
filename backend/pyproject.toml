[project]
name = "to-herd-cats-ai"
version = "0.1.0"
description = "to-herd-cats-ai control API"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.40",
    "pydantic[email]>=2.12",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "uuid-utils>=0.11",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "mypy>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N"]
ignore = ["S101", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"alembic/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
